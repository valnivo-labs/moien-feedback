# Deletes the chat rooms that ended, every hour — in PUBLIC.
#
# This file lives in the private repository `valnivo-labs/moien` at
# tools/public-builds/chat-rooms.yml and is COPIED to `valnivo-labs/moien-feedback`
# as .github/workflows/chat-rooms.yml. Edit it there only by copying from here.
#
# WHY IT RUNS HERE
#
# A room ends after 5 hours without a message, or once it is empty (owner,
# 2026-10-02; docs/chat.md "Rooms that end"). The rules hide an ended room at once
# and the app deletes the ones it sees, but on the Spark plan nothing on the server
# runs by itself, so this job deletes the rest. Hourly is ~720 runs a month: free in
# a public repository, a third of the private one's allowance otherwise.
#
# THE SOURCE STAYS PRIVATE, AND THE LOG SAYS NOTHING
#
# The source is checked out with the read-only deploy key the APK build already uses
# (MOIEN_SOURCE_DEPLOY_KEY) and only tools/chat-purge.mjs is run, with --rooms. It
# prints one count; no room name, message or id reaches this public log.
#
# Secrets, set in THIS repository: MOIEN_SOURCE_DEPLOY_KEY (already there) and
# DONATIONS_SERVICE_ACCOUNT (the same key as in valnivo-labs/moien: the service
# account `donations-purge`, Cloud Datastore User only). Without the second the job
# skips and says so.
name: Delete ended chat rooms

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only count what would be deleted'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chat-rooms
  cancel-in-progress: false

jobs:
  rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secret
        id: secret
        env:
          SA: ${{ secrets.DONATIONS_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::DONATIONS_SERVICE_ACCOUNT is not set here; no room deleted."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the app source (private, read-only)
        if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          repository: valnivo-labs/moien
          ssh-key: ${{ secrets.MOIEN_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false
          sparse-checkout: tools/chat-purge.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Delete ended rooms
        if: steps.secret.outputs.ok == 'true'
        env:
          DONATIONS_SERVICE_ACCOUNT: ${{ secrets.DONATIONS_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/rooms"
          cp source/tools/chat-purge.mjs "$RUNNER_TEMP/rooms/"
          rm -rf source
          cd "$RUNNER_TEMP/rooms"
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase-admin@13 >/dev/null
          if [ "$DRY_RUN" = "true" ]; then node chat-purge.mjs --rooms --dry-run; else node chat-purge.mjs --rooms; fi
