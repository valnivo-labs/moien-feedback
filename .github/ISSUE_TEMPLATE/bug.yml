name: Bug
description: Something in the app does not work
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer, and browser
      placeholder: iPhone, Safari · Windows, Chrome · installed app on Android
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: /lesson/a1-03
